# apps/edge tuning (copy to config.yaml). Secrets and camera URLs live in .env.
room_code: B204

gate:
  process_every_nth: 2        # run face detection on every Nth new frame (CPU budget)
  rotate: 0                   # clockwise degrees; 90 for a phone held in PORTRAIT with IP Webcam (it streams sideways)
  det_size: 640               # SCRFD input size
  min_face_px: 60             # smaller faces are tracked but not used for recognition
  min_det_score: 0.6
  # Entry line in normalised frame coords (0..1), drawn across the doorway as the CAMERA sees it.
  line_a: [0.0, 0.55]
  line_b: [1.0, 0.55]
  in_side: 1                  # +1: a face moving from ABOVE the line to BELOW it is IN; -1: the opposite
  min_travel_px: 25
  # line = count IN only when a face crosses the line toward the room (spec).
  # presence = phone looks only at people walking IN (simplest live demo): a recognised face seen for
  #            presence_min_s counts as IN.
  entry_mode: line
  presence_min_s: 0.6
  accept: 0.45                # cosine threshold (tune with scripts/face-eval.py)
  margin: 0.08
  min_votes: 2

inside:
  enabled: true
  interval_s: 3               # YOLOv8n every 3 s
  publish_s: 10               # OCCUPANCY_UPDATED every 10 s
  conf: 0.4
  window: 10                  # median of the last 10 samples
  stable_count_seconds: 60    # 'stable' = unchanged for 60 s (only stable counts trigger alerts)
  rotate: 0
  roi: [[0.0, 0.3], [1.0, 0.3], [1.0, 1.0], [0.0, 1.0]]   # seat area; feet outside it are ignored

heartbeat_seconds: 15
gallery_refresh_seconds: 60   # re-fetch the session gallery (students who enroll during class)
control_poll_seconds: 15      # fallback HTTP poll of the current session if no MQTT control arrives
