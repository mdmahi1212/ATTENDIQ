# AttendIQ classroom broker. Start: scripts\start-classroom.ps1 (or: mosquitto -c infra\mosquitto\mosquitto.conf -v)
# LAN only (the ESP32 and phones on the classroom Wi-Fi). TLS on 8883 is an optional final step (see README).
listener 1883 0.0.0.0
allow_anonymous false
# Paths are relative to the directory mosquitto is started from (the repo root).
password_file infra/mosquitto/passwd
acl_file infra/mosquitto/acl
persistence true
persistence_location infra/mosquitto/data/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true
max_queued_messages 10000
