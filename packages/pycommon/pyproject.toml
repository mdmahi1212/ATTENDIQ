[project]
name = "attendiq-common"
version = "0.1.0"
description = "Shared event envelope, MQTT topics and API client for the AttendIQ edge, ingest and simulator"
requires-python = ">=3.11"
dependencies = ["pydantic>=2", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["attendiq_common"]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.ruff.lint.isort]
known-first-party = ["attendiq_common", "ingest", "simulator", "edge"]
